# プラグインを有効にするか。false なら何もしない。
enabled: true

# /modifier status などで返すメッセージの接頭辞 (MiniMessage 形式)。
message-prefix: "<gray>[<aqua>Modifier<gray>]</gray> "

# モディファイア選択画面
selection:
  # 画面上部に出すタイトル (MiniMessage 形式)
  title: "<dark_gray>モディファイアを選択"
  # 提示する選択肢の数 (1〜3)
  choice-count: 3

  # 未選択のまま閉じられたら開き直す。false にすると閉じたままにできる。
  force: true

# 参加者へ配るリソースパック。
# パックはプラグインの jar に同梱してあり、下の設定で立てる HTTP サーバーが配る。
# SHA-1 は中身から自動で計算するので、書き換えても手当ては要らない。
resource-pack:
  enabled: true

  # クライアントへ知らせるホスト。ここへ取りに来るので、
  # プレイヤーの環境から届くアドレスにすること (公開サーバーならグローバル IP かドメイン)。
  host: "127.0.0.1"

  # 待ち受けるアドレス。127.0.0.1 にすると同じマシンからしか取れない。
  bind: "0.0.0.0"

  # 待ち受けるポート。Minecraft 本体とは別に開ける必要がある。
  port: 8123

  # true なら、拒否したプレイヤーはクライアント側で接続を切られる。
  required: true

  # ダウンロードの確認画面に出す文言 (MiniMessage 形式)。
  prompt: "<gold>モディファイアのアイコンを表示するために必要です"

  # パックの適用を待つ上限 (tick)。過ぎたら待たずに選択画面を出す。
  apply-timeout-ticks: 200

# 効果まわり
effects:
  # 接地判定など、イベントで拾えないものを見る間隔 (tick)。
  # 二段ジャンプの復帰の速さに効く。
  tick-period-ticks: 2
